<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13283b">
<title>ROBOLAB V7RC BLE 遙控器</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#eef5fc;background:#0d1928}*{box-sizing:border-box}body{margin:0;padding:14px;touch-action:manipulation}.panel{max-width:510px;margin:auto;background:#16283c;border:1px solid #34506a;border-radius:20px;padding:18px;box-shadow:0 10px 35px #0004}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading{font-size:20px;font-weight:750}.status{font-size:13px;color:#bac9d9;margin-top:6px;overflow-wrap:anywhere}.status.online{color:#78e3a0}.status.error{color:#ffadad}button{font:inherit;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}.connect{border:0;background:#3b91ee;color:white;padding:13px 17px;border-radius:12px;font-weight:700;white-space:nowrap}.connect.disconnect{background:#a9444b}.connect:disabled{opacity:.65}.divider{height:1px;background:#35516c;margin:18px 0}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.group{border:1px solid #58748e;background:#233b54;color:#e6f1fc;border-radius:12px;padding:14px 3px;font-weight:700}.group.selected{background:#317fcd;border-color:#83c5ff}.slider-block{margin:20px 0}.slider-header{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:700}.slider-header span{color:#bbd5ef;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#51a8ff;cursor:pointer;touch-action:pan-y}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dir{min-height:85px;background:#29445f;color:white;border:1px solid #52728e;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.dir .arrow{font-size:32px;line-height:1}.dir .key{font-size:14px;font-weight:700}.dir.pressed{background:#1680c7;border-color:#8ed4ff;transform:scale(.97)}.empty{visibility:hidden}.footer{font-size:12px;color:#9db4c9;text-align:center;margin-top:17px;line-height:1.6}.diagnostic{font-size:12px;color:#aac5df;margin-top:12px;overflow-wrap:anywhere;font-family:ui-monospace,monospace}button:focus-visible,input:focus-visible{outline:3px solid #b8e3ff;outline-offset:2px}@media(max-width:350px){.panel{padding:12px}.heading{font-size:17px}.dir{min-height:72px}}
</style>
</head>
<body>
<main class="panel">
<header><div><div class="heading">ROBOLAB V7RC BLE</div><div id="status" class="status" role="status" aria-live="polite">● 尚未連線</div></div><button id="connect" class="connect" type="button">藍牙連線</button></header>
<div class="divider"></div>
<div class="groups" aria-label="群組選擇"><button class="group selected" data-group="1" aria-pressed="true">群組 1</button><button class="group" data-group="2" aria-pressed="false">群組 2</button><button class="group" data-group="3" aria-pressed="false">群組 3</button></div>
<section class="slider-block"><label class="slider-header" for="throttle1">油門 1 <span id="throttle1-value">0 / 15</span></label><input id="throttle1" type="range" min="0" max="15" value="0" step="1"></section>
<section class="slider-block"><label class="slider-header" for="throttle2">油門 2 <span id="throttle2-value">0 / 15</span></label><input id="throttle2" type="range" min="0" max="15" value="0" step="1"></section>
<div class="divider"></div>
<div class="directions" aria-label="八方向控制">
<button class="dir" data-key="5"><span class="arrow">↖</span><span class="key">K5</span></button>
<button class="dir" data-key="1"><span class="arrow">↑</span><span class="key">K1</span></button>
<button class="dir" data-key="7"><span class="arrow">↗</span><span class="key">K7</span></button>
<button class="dir" data-key="3"><span class="arrow">←</span><span class="key">K3</span></button>
<div class="empty" aria-hidden="true"></div>
<button class="dir" data-key="4"><span class="arrow">→</span><span class="key">K4</span></button>
<button class="dir" data-key="6"><span class="arrow">↙</span><span class="key">K6</span></button>
<button class="dir" data-key="2"><span class="arrow">↓</span><span class="key">K2</span></button>
<button class="dir" data-key="8"><span class="arrow">↘</span><span class="key">K8</span></button>
</div>
<div id="packet" class="diagnostic">SS89696969696966464#</div>
<div class="footer">按住方向鍵控制，放開回中心 · 每 100 ms 發送 SS8<br>建議使用 Android Chrome 與 HTTPS（GitHub Pages）</div>
</main>
<script>
'use strict';
const SERVICE_UUID='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_UUID='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const CENTER=0x96, LOW=0x64, HIGH=0xC8;
const positions={1:[CENTER,HIGH],2:[CENTER,LOW],3:[LOW,CENTER],4:[HIGH,CENTER],5:[LOW,HIGH],6:[LOW,LOW],7:[HIGH,HIGH],8:[HIGH,LOW]};
// 群組 2 的軸順序與群組 1、3 相反：軸3=Y，軸4=X。
let group=1, activeKey=0, activePointer=null;
let device=null, server=null, characteristic=null, timer=null, writing=false, pending=false, connecting=false;
let throttle1=0, throttle2=0;
const statusEl=document.getElementById('status');
const connectBtn=document.getElementById('connect');
const packetEl=document.getElementById('packet');
const dirButtons=[...document.querySelectorAll('.dir')];
const encoder=new TextEncoder();
function hex(value){return value.toString(16).toUpperCase().padStart(2,'0')}
function throttleValue(step){return LOW+Math.round(step*(HIGH-LOW)/15)}
function makePacket(){
 const axes=[CENTER,CENTER,CENTER,CENTER,CENTER,CENTER,throttleValue(throttle1),throttleValue(throttle2)];
 if(activeKey){const [x,y]=positions[activeKey];const offset=(group-1)*2;
   if(group===2){axes[offset]=y;axes[offset+1]=x}else{axes[offset]=x;axes[offset+1]=y}
 }
 return 'SS8'+axes.map(hex).join('')+'#';
}
function refreshPacket(){packetEl.textContent=makePacket()}
function setStatus(message,kind=''){statusEl.textContent='● '+message;statusEl.className='status '+kind}
function resetControls(){activeKey=0;activePointer=null;throttle1=0;throttle2=0;
 document.getElementById('throttle1').value='0';document.getElementById('throttle2').value='0';
 document.getElementById('throttle1-value').textContent='0 / 15';document.getElementById('throttle2-value').textContent='0 / 15';
 dirButtons.forEach(b=>b.classList.remove('pressed'));refreshPacket()}
function stopSending(){if(timer!==null){clearInterval(timer);timer=null}pending=false}
function disconnectEvent(){stopSending();characteristic=null;server=null;writing=false;connecting=false;resetControls();connectBtn.disabled=false;connectBtn.classList.remove('disconnect');connectBtn.textContent='藍牙連線';setStatus('尚未連線')}
async function writePacket(){
 if(!characteristic||!device?.gatt?.connected){return}
 if(writing){pending=true;return}
 writing=true;
 try{do{pending=false;const bytes=encoder.encode(makePacket());
   if(characteristic.properties.writeWithoutResponse&&characteristic.writeValueWithoutResponse){await characteristic.writeValueWithoutResponse(bytes)}
   else if(characteristic.properties.write&&characteristic.writeValueWithResponse){await characteristic.writeValueWithResponse(bytes)}
   else{await characteristic.writeValue(bytes)}
 }while(pending&&device?.gatt?.connected)}
 catch(err){setStatus('發送失敗：'+err.message,'error');stopSending()}
 finally{writing=false}
}
async function connect(){
 if(!navigator.bluetooth){setStatus('此瀏覽器不支援 Web Bluetooth，請使用 Android Chrome / HTTPS','error');return}
 connecting=true;connectBtn.disabled=true;setStatus('選擇 BLE 裝置中…');
 try{
  // 以服務 UUID 搜尋，亦可顯示不同名稱但使用同一 NUS 服務的裝置。
  device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE_UUID]}],optionalServices:[SERVICE_UUID]});
  device.addEventListener('gattserverdisconnected',disconnectEvent);
  setStatus('正在連線 '+(device.name||'BLE 裝置')+'…');
  server=await device.gatt.connect();
  const service=await server.getPrimaryService(SERVICE_UUID);
  characteristic=await service.getCharacteristic(RX_UUID);
  resetControls();
  connectBtn.textContent='斷線';connectBtn.classList.add('disconnect');
  setStatus('已連線：'+(device.name||'BLE 裝置'),'online');
  timer=setInterval(writePacket,100);
  await writePacket();
 }catch(err){if(device?.gatt?.connected)device.gatt.disconnect();disconnectEvent();
   if(err.name!=='NotFoundError')setStatus('連線失敗：'+err.message,'error');
 }finally{connecting=false;connectBtn.disabled=false}
}
async function disconnect(){
 stopSending();resetControls();
 // 儘可能送出中立方向與最低油門，實際送達仍取決於 BLE 連線。
 if(characteristic&&device?.gatt?.connected){await writePacket()}
 if(device?.gatt?.connected)device.gatt.disconnect();else disconnectEvent();
}
connectBtn.addEventListener('click',()=>{if(connecting)return;if(device?.gatt?.connected)disconnect();else connect()});
function releaseDirection(){if(activeKey){activeKey=0;activePointer=null;dirButtons.forEach(b=>b.classList.remove('pressed'));refreshPacket();writePacket()}}
dirButtons.forEach(button=>{
 const key=Number(button.dataset.key);
 button.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;activeKey=key;button.setPointerCapture(e.pointerId);dirButtons.forEach(b=>b.classList.toggle('pressed',b===button));refreshPacket();writePacket()});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>{if(e.pointerId===activePointer)releaseDirection()});
});
window.addEventListener('blur',releaseDirection);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseDirection()});
document.querySelectorAll('.group').forEach(button=>button.addEventListener('click',()=>{
 releaseDirection();group=Number(button.dataset.group);
 document.querySelectorAll('.group').forEach(b=>{const selected=b===button;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});
 dirButtons.forEach(b=>{b.querySelector('.key').textContent='K'+((group-1)*8+Number(b.dataset.key))});refreshPacket();writePacket();
}));
for(const i of [1,2])document.getElementById('throttle'+i).addEventListener('input',e=>{
 const n=Number(e.target.value);if(i===1)throttle1=n;else throttle2=n;
 document.getElementById('throttle'+i+'-value').textContent=n+' / 15';refreshPacket();writePacket();
});
refreshPacket();
</script>
</body>
</html>
